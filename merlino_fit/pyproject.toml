[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merlino-fit"
version = "0.0.1"
description = "Robust PES fit prototype"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.scripts]
merlino-fit = "survibfit.cli:main"
merlino-similarity = "survibfit.synthon_similarity:main"
merlino-auto-report = "survibfit.auto_report_pipeline:main"
merlino-fragment-pipeline = "survibfit.fragment_pipeline:main"
merlino-fragment-delta = "survibfit.fragment_delta_correction:main"

[tool.setuptools]
packages = ["survibfit", "topology"]

[tool.pytest.ini_options]
cache_dir = "/tmp/pytest-cache"
